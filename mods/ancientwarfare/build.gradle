plugins {
    id 'mod.conventions'
}

repositories {
    maven { url = 'https://maven.blamejared.com/' }
    // Serene Seasons and GlitchCore are optional: only the API is needed to compile compat/sereneseasons, their classes are never loaded without the mods.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // JEI is optional: the API is only needed to compile compat/jei, the classes are never loaded without JEI.
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247"
    // Serene Seasons 10.1.0.9 and GlitchCore 2.1.0.2, the NeoForge 1.21.1 files. The Modrinth maven needs the version id here because the version number is shared by the
    // Forge, Fabric and NeoForge files: pHEgQQUE = Serene Seasons 10.1.0.9 (NeoForge), S2TfWrZR = GlitchCore 2.1.0.2 (NeoForge).
    compileOnly "maven.modrinth:serene-seasons:pHEgQQUE"
    compileOnly "maven.modrinth:glitchcore:S2TfWrZR"
}
