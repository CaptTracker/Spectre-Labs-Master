plugins {
    id 'mod.conventions'
}

evaluationDependsOn(':ancientwarfare')
evaluationDependsOn(':ancientwarfarevehicle')
evaluationDependsOn(':spectrefactions')

repositories {
    // Jade and WTHIT are optional: only the API is needed to compile compat/jade and compat/wthit, their classes are never loaded without the mods.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // JourneyMap API (compile only: its licence forbids redistribution, nothing of it is shipped).
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'info.journeymap' }
    }
    maven {
        url = 'https://maven2.bai.lol'
        content {
            includeGroup 'lol.bai'
            includeGroup 'mcp.mobius.waila'
        }
    }
}

dependencies {
    implementation project(':ancientwarfare')
    implementation project(':ancientwarfarevehicle')
    implementation project(':spectrefactions')
    compileOnly "maven.modrinth:jade:15.10.6+neoforge"
    compileOnly "mcp.mobius.waila:wthit-api:neo-12.10.3"
    // Weather2 is optional: compat/weather2 is only loaded when the mod is installed. Ice and Fire needs no compile dependency (it is detected by registry ids and tags).
    compileOnly "maven.modrinth:weather-storms-tornadoes:1.21.0-2.8.7"
    compileOnly "maven.modrinth:coroutil:1.21.0-1.3.8"
    // Farmer's Delight is optional: compat/farmersdelight is only loaded when the mod is installed (the kitchen of the cook). Its farm and food parts use registry ids only.
    compileOnly "maven.modrinth:farmers-delight:1.21.1-1.3.4"
    // JourneyMap is optional: compat/journeymap/client is only loaded by JourneyMap itself (plugin scan). Xaero's Minimap needs no dependency (chat message format).
    compileOnly "info.journeymap:journeymap-api-neoforge:2.0.0-1.21.1"
}

// Load the Ancient Warfare modules this one needs in runClient/runServer.
neoForge {
    mods {
        create('ancientwarfare') {
            sourceSet(project(':ancientwarfare').sourceSets.main)
        }
        create('ancientwarfarevehicle') {
            sourceSet(project(':ancientwarfarevehicle').sourceSets.main)
        }
        create('spectrefactions') {
            sourceSet(project(':spectrefactions').sourceSets.main)
        }
    }
}
