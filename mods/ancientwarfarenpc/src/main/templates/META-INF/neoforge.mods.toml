modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="${lib_mod_id}"
    type="required"
    versionRange="${lib_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ancientwarfare"
    type="required"
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ancientwarfarevehicle"
    type="required"
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="spectrefactions"
    type="required"
    versionRange="[1.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Optional integrations (third round). Every class that touches these mods is in a compat package that is only loaded when the mod is installed.
[[dependencies.${mod_id}]]
    modId="iceandfire"
    type="optional"
    versionRange="[2.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="weather2"
    type="optional"
    versionRange="[1.21.0-2.8.7,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="coroutil"
    type="optional"
    versionRange="[1.21.0-1.3.7,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sereneseasons"
    type="optional"
    versionRange="[10.1.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="farmersdelight"
    type="optional"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="journeymap"
    type="optional"
    versionRange="[1,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.${mod_id}]]
    modId="xaerominimap"
    type="optional"
    versionRange="[1,)"
    ordering="AFTER"
    side="CLIENT"
