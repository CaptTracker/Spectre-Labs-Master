# ---- Gradle ----
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# ---- Shared toolchain versions (bump these in ONE place for every mod) ----
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.266
neo_version_range=[21.1.0,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ---- Shared mod metadata defaults (a mod's own gradle.properties can override) ----
mod_group_id=io.github.capttracker
mod_authors=CaptTracker
mod_license=All Rights Reserved

# ---- Shared library ----
lib_mod_id=spectrelib
lib_version_range=[1.0.0,)
